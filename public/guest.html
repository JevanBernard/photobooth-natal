<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{EVENT}} — Foto kamu</title>
<style>
  :root { --bg:#faf7f2; --fg:#2b2620; --accent:#2b2620; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16130f; --fg:#f3eee6; --accent:#f3eee6; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 32px; gap:18px; }
  h1 { font-size:1.15rem; margin:4px 0 0; font-weight:700; letter-spacing:.02em; }
  img { width:100%; max-width:420px; height:auto; border-radius:6px; box-shadow:0 6px 28px #0003; }
  .actions { display:flex; flex-direction:column; gap:10px; width:100%; max-width:420px; }
  a.btn, button { display:block; text-align:center; text-decoration:none; font:inherit; font-weight:700;
    padding:14px 18px; border-radius:12px; border:2px solid var(--accent); cursor:pointer; }
  a.primary { background:var(--accent); color:var(--bg); }
  button { background:transparent; color:var(--fg); }
  small { opacity:.65; text-align:center; max-width:420px; line-height:1.45; }
</style>
</head>
<body>
  <h1>{{EVENT}}</h1>
  <img src="/photo/{{ID}}.jpg" alt="Foto kamu">
  <div class="actions">
    <a class="btn primary" href="/photo/{{ID}}.jpg?download=1" download>Unduh foto</a>
    <button id="share" hidden>Bagikan</button>
  </div>
  <small>Tip: di iPhone, kalau tombol unduh tidak menyimpan ke Galeri, tahan lama pada foto lalu pilih "Simpan ke Foto".
  Foto ini hanya dapat dibuka lewat link/QR ini dan akan dihapus otomatis setelah {{DAYS}} hari.</small>
<script>
  const btn = document.getElementById('share');
  if (navigator.share) {
    btn.hidden = false;
    btn.onclick = async () => {
      try {
        const blob = await (await fetch('/photo/{{ID}}.jpg')).blob();
        const file = new File([blob], 'foto.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
        else await navigator.share({ url: location.href });
      } catch (e) {}
    };
  }
</script>
</body>
</html>
